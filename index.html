<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/ui/styles.css">
  <title>The 25th Hour — Commitment Check</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="sr-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/home" data-home="home" aria-label="The 25th Hour, home">
          <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
            <path d="M24.9 8.6A12 12 0 1 0 28 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M16 9.5V16l4.2 2.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="brand-text">The <span class="brand-25">25</span>th Hour</span>
        </a>
        <div class="topbar-links">
          <span id="example-chip" class="example-chip" hidden>
            <span>Example data</span>
            <button type="button" id="leave-example" class="link-button">Leave example</button>
          </span>
          <a class="topbar-link" id="nav-week" href="#/week" data-screen="week">My week</a>
        </div>
      </div>
    </header>

    <main id="main-content" class="workspace" tabindex="-1">
      <div id="status-region" class="status-banner" role="status" aria-live="polite" hidden></div>
      <div id="error-region" class="banner banner-alert" role="alert" hidden></div>

      <section id="screen-home" class="screen-panel" aria-label="Home"></section>
      <section id="screen-check" class="screen-panel" aria-label="Check a request" hidden></section>
      <section id="screen-week" class="screen-panel" aria-label="My week" hidden></section>
      <section id="screen-rescue" class="screen-panel" aria-label="Reset" hidden></section>
      <section id="screen-feedback" class="screen-panel" aria-label="Review" hidden></section>
      <section id="screen-settings" class="screen-panel" aria-label="Settings" hidden></section>
    </main>

    <footer class="site-footer">
      <p>Everything stays in this browser. A feasible plan makes room to sleep; it can't guarantee sleep. Not medical advice.</p>
    </footer>
  </div>
  <script type="module" src="./src/ui/app.mjs"></script>
</body>
</html>
