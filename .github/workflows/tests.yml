name: Node tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - name: Chromium smoke and performance
        env:
          CHROMIUM: google-chrome
          CHROMIUM_NO_SANDBOX: '1'
        run: |
          "$CHROMIUM" --version
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/25th-hour-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8000/ > /dev/null
          node tests/ui/browser-smoke.mjs
      - name: Chromium smoke under a GitHub Pages-style subpath
        env:
          CHROMIUM: google-chrome
          CHROMIUM_NO_SANDBOX: '1'
          TEST_ORIGIN: http://127.0.0.1:8001/The-25th-Hour
        run: |
          mkdir -p /tmp/pages && ln -sfn "$GITHUB_WORKSPACE" /tmp/pages/The-25th-Hour
          python3 -m http.server 8001 --bind 127.0.0.1 --directory /tmp/pages > /tmp/25th-hour-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused "$TEST_ORIGIN/" > /dev/null
          node tests/ui/browser-smoke.mjs
