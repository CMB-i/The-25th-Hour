name: Node tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - name: Chromium smoke and performance
        env:
          CHROMIUM: google-chrome
          CHROMIUM_NO_SANDBOX: '1'
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/25th-hour-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8000/ > /dev/null
          node tests/ui/browser-smoke.mjs
